<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121630" />
      <stop offset="100%" stop-color="#080A16" />
    </linearGradient>

    <!-- Vibrant Violet/Indigo Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#7C5DFA" />
      <stop offset="100%" stop-color="#4F6EF7" />
    </linearGradient>

    <!-- Warm Amber Star Glow -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD382" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(124, 93, 250, 0.4)" stroke-width="2" />

  <!-- Subtle Math Grid Ticks -->
  <path d="M12 32h6M46 32h6M32 12v6M32 46v6" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central Mathematical Compass / Delta Angle Shape -->
  <path d="M32 15L17 48h30L32 15z" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linejoin="round" fill="rgba(124, 93, 250, 0.12)" />

  <!-- Crossbar with Golden Measure Line -->
  <path d="M22 37h20" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Center Radiant Focus Star (AINerd Intelligence Node) -->
  <circle cx="32" cy="15" r="4" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="32" cy="15" r="1.5" fill="#FFFFFF" />

  <!-- Corner Sparkle -->
  <path d="M46 14l1.5 3.5L51 19l-3.5 1.5L46 24l-1.5-3.5L41 19l3.5-1.5L46 14z" fill="#FFD382" opacity="0.9" />
</svg>