<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="50%" stop-color="#0D111F" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Bevel Border Gradient -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="50%" stop-color="rgba(124, 93, 250, 0.2)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.8)" />
    </linearGradient>

    <!-- Titanium Metal Facet Gradient -->
    <linearGradient id="titaniumLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="titaniumRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Electric Violet Crystal Facet -->
    <linearGradient id="violetPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Cyan / Azure Neon Crystal Facet -->
    <linearGradient id="cyanPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Apex Core Glow -->
    <radialGradient id="apexGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Facets -->
    <filter id="facetShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Obsidian Dark Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#bevelGrad)" stroke-width="1.5" />

  <!-- Ambient Internal Core Glow -->
  <circle cx="32" cy="36" r="22" fill="url(#apexGlow)" />

  <!-- Precision Geometric Faceted 'V' -->
  <g filter="url(#facetShadow)">
    <!-- Left Outer Titanium Facet -->
    <path d="M16 19L24 19L24 35L16 23Z" fill="url(#titaniumLeft)" />

    <!-- Left Inner Crystal Violet Facet -->
    <path d="M24 19L32 37L32 47L24 35Z" fill="url(#violetPrism)" />

    <!-- Left Upper Bevel Edge -->
    <path d="M16 19L24 19L20 22Z" fill="#FFFFFF" opacity="0.4" />

    <!-- Right Outer Titanium Facet -->
    <path d="M48 19L40 19L40 35L48 23Z" fill="url(#titaniumRight)" />

    <!-- Right Inner Cyan Crystal Facet -->
    <path d="M40 19L32 37L32 47L40 35Z" fill="url(#cyanPrism)" />

    <!-- Right Upper Bevel Edge -->
    <path d="M48 19L40 19L44 22Z" fill="#FFFFFF" opacity="0.6" />

    <!-- Center Apex Triangle / Titanium Keystone Base -->
    <path d="M32 37L28 44L32 50L36 44Z" fill="url(#titaniumLeft)" />

    <!-- Center Illuminated Radiant Seam -->
    <line x1="32" y1="37" x2="32" y2="47" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>